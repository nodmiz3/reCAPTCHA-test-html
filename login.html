<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログイン</title>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>

  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
      --scale: 1;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-size: calc(16px * var(--scale));
      padding: 20px;
      font-family: sans-serif;
    }
    input, button, a {
      font-size: calc(16px * var(--scale));
    }
  </style>
</head>
<body>

<script>
// テーマとスケール適用
function applyTheme() {
  const theme = localStorage.getItem("theme");
  if (theme === "dark") {
    document.documentElement.style.setProperty("--bg", "#222");
    document.documentElement.style.setProperty("--text", "#fff");
  } else if (theme === "blue") {
    document.documentElement.style.setProperty("--bg", "#e3f2fd");
    document.documentElement.style.setProperty("--text", "#0d47a1");
  } else {
    document.documentElement.style.setProperty("--bg", "#fff");
    document.documentElement.style.setProperty("--text", "#000");
  }
}
function applyScale() {
  const scale = localStorage.getItem("scale") || "1";
  document.documentElement.style.setProperty("--scale", scale);
}
applyTheme();
applyScale();

// SHA-256 ハッシュ化
async function hashPassword(password) {
  const encoder = new TextEncoder();
  const data = encoder.encode(password);
  const hashBuffer = await crypto.subtle.digest("SHA-256", data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
}
</script>

<h2>ログイン</h2>

<input type="text" id="username" placeholder="ユーザー名"><br><br>
<input type="password" id="password" placeholder="パスワード"><br><br>

<div class="g-recaptcha" data-sitekey="6LfHnectAAAAADsAn9nSqLhKNr4UNjKzDwiZrYsT"></div><br>

<button onclick="login()">ログイン</button>

<p><a href="index.html">新規登録はこちら</a></p>
<button onclick="goBack()">戻る</button>

<script>
function goBack() {
  window.location.href = "index.html";
}

async function login() {
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;

  const recaptcha = grecaptcha.getResponse();
  if (!recaptcha) {
    alert("reCAPTCHA を完了してください");
    return;
  }

  let users = JSON.parse(localStorage.getItem("users")) || [];

  const hashedInput = await hashPassword(pass);

  const found = users.find(u => u.username === user && u.password === hashedInput);

  if (found) {
    localStorage.setItem("loggedin", "true");
    localStorage.setItem("currentUser", user);

    if (user === "nodmiz3admin") {
      localStorage.setItem("isAdmin", "true");
    } else {
      localStorage.removeItem("isAdmin");
    }

    window.location.href = "home.html";

  } else {
    alert("ユーザー名またはパスワードが違います");
  }
}
</script>

</body>
</html>
