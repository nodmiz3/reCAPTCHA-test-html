<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>設定ページ</title>

  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
      --scale: 1;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-size: calc(16px * var(--scale));
      padding: 20px;
      font-family: sans-serif;
    }
    input, select, button {
      font-size: calc(16px * var(--scale));
      padding: 8px;
      margin-bottom: 15px;
      width: 250px;
    }
  </style>
</head>
<body>

<script>
// テーマとスケール適用
function applyTheme() {
  const theme = localStorage.getItem("theme");
  if (theme === "dark") {
    document.documentElement.style.setProperty("--bg", "#222");
    document.documentElement.style.setProperty("--text", "#fff");
  } else if (theme === "blue") {
    document.documentElement.style.setProperty("--bg", "#e3f2fd");
    document.documentElement.style.setProperty("--text", "#0d47a1");
  } else {
    document.documentElement.style.setProperty("--bg", "#fff");
    document.documentElement.style.setProperty("--text", "#000");
  }
}
function applyScale() {
  const scale = localStorage.getItem("scale") || "1";
  document.documentElement.style.setProperty("--scale", scale);
}
applyTheme();
applyScale();
</script>

<h2>設定ページ</h2>

<label>表示名：</label><br>
<input type="text" id="displayName"><br>

<label>テーマ：</label><br>
<select id="theme">
  <option value="light">ライト</option>
  <option value="dark">ダーク</option>
  <option value="blue">ブルー</option>
</select><br>

<label>UIスケール：</label><br>
<select id="scale">
  <option value="1">標準</option>
  <option value="1.2">大</option>
  <option value="1.4">特大</option>
</select><br>

<button onclick="saveSettings()">保存</button>
<button onclick="goBack()">戻る</button>

<script>
window.onload = () => {
  document.getElementById("displayName").value = localStorage.getItem("displayName") || "";
  document.getElementById("theme").value = localStorage.getItem("theme") || "light";
  document.getElementById("scale").value = localStorage.getItem("scale") || "1";
};

function saveSettings() {
  localStorage.setItem("displayName", document.getElementById("displayName").value);
  localStorage.setItem("theme", document.getElementById("theme").value);
  localStorage.setItem("scale", document.getElementById("scale").value);

  alert("設定を保存しました");
  applyTheme();
  applyScale();
}

function goBack() {
  window.location.href = "home.html";
}
</script>

</body>
</html>
