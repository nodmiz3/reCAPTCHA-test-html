<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログイン</title>
  <style>
    body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .login-box { background: #fff; padding: 30px; width: 350px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    input { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #e1e5e9; border-radius: 8px; }
    button { width: 100%; padding: 12px; background: #4a90e2; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

<div class="login-box">
  <h2>ログイン</h2>
  <input type="text" id="username" placeholder="ユーザー名">
  <input type="password" id="password" placeholder="パスワード">
  <button onclick="login()">ログイン</button>
</div>

<script>
function login() {
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;

  // ★ ここでログイン判定（好きに変更できる）
  if (user === "nodmiz3" && pass === "greenfrog41github") {
    localStorage.setItem("loggedin", "true");
    window.location.href = "home.html";
  } else {
    alert("ユーザー名またはパスワードが違います");
  }
}
</script>

</body>
</html>
